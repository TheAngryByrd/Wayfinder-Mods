# Supported range: 1.0 through 100.0.
[General]
CoreProbabilityMultiplier=2.0
FinalProbabilityMultiplier=1.0
MinAmountMultiplier=1.0
MaxAmountMultiplier=1.0

# Copy an item_key from MoreDropsNative.log. Item probability supports 0 through 100.
[ItemProbability]
# DataTableName:ItemRowName=0

# Keep only the listed Echo rarities. Epic is purple.
[EchoFilter]
AllowedRarities=All

# Keep only the listed accessory and relic rarities. Recipe items are not filtered.
[AccessoryFilter]
AllowedRarities=Epic

# Guarantee eligible items from each boss-specific unique pool.
[BossDrops]
DropAllUniques=false

# Keep the original Echo rarity or force matching source groups to Epic.
[EchoRarityOverride]
Bosses=Original
WorldBosses=Original
RareEnemies=Original
